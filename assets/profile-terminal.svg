<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 720"
  role="img"
  aria-labelledby="terminal-title terminal-desc"
  preserveAspectRatio="xMidYMid meet"
  xml:space="preserve"
>
  <title id="terminal-title">Laith Masri terminal profile</title>
  <desc id="terminal-desc">
    A dark terminal-style profile for Laith Masri, founder of Lunvex Labs and an Electrical and Electronic Engineering student at Aston University. An original circuit-like L mark sits beside verified profile, engineering, current-work and contact details.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1726" />
      <stop offset="0.56" stop-color="#0B1320" />
      <stop offset="1" stop-color="#080F1A" />
    </linearGradient>
    <radialGradient id="signal-glow" cx="0" cy="0" r="1" gradientTransform="translate(252 344) rotate(90) scale(330 350)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17475A" stop-opacity="0.34" />
      <stop offset="0.62" stop-color="#10283B" stop-opacity="0.12" />
      <stop offset="1" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="panel-shadow" x="0" y="0" width="1200" height="720" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="panel-clip">
      <rect x="24" y="20" width="1152" height="680" rx="20" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;
    }

    .hairline {
      vector-effect: non-scaling-stroke;
    }

    .wide {
      display: inline;
    }

    .rail {
      fill: #D3A06F;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .rail-muted {
      fill: #9AA7B8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .prompt {
      fill: #B7C0CD;
      font-size: 15.5px;
      font-weight: 500;
    }

    .prompt-user {
      fill: #62D4E8;
      font-weight: 700;
    }

    .name {
      fill: #E8EDF3;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .tagline {
      fill: #B7C0CD;
      font-size: 16px;
    }

    .section {
      fill: #62D4E8;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .row-label {
      fill: #D3A06F;
      font-size: 15px;
      font-weight: 700;
    }

    .row-value {
      fill: #E8EDF3;
      font-size: 15px;
      font-weight: 500;
    }

    .leader {
      stroke: #536278;
      stroke-width: 1.4;
      stroke-dasharray: 1 6;
      stroke-linecap: round;
    }

    .ascii {
      font-size: 20.5px;
      font-weight: 600;
    }

    .ascii-warm {
      fill: #D3A06F;
    }

    .ascii-cyan {
      fill: #62D4E8;
    }

    .ascii-muted {
      fill: #75869A;
    }

    .domain {
      fill: #E8EDF3;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.6px;
    }

    .domain-sub {
      fill: #9AA7B8;
      font-size: 13px;
    }

  </style>

  <rect width="1200" height="720" rx="28" fill="#060A12" />
  <rect x="24" y="20" width="1152" height="680" rx="20" fill="url(#panel-fill)" filter="url(#panel-shadow)" />
  <g clip-path="url(#panel-clip)">
    <ellipse cx="252" cy="344" rx="350" ry="330" fill="url(#signal-glow)" />
    <path d="M24 108H1176" stroke="#16253A" stroke-width="1" class="hairline" />
  </g>
  <rect x="24.5" y="20.5" width="1151" height="679" rx="19.5" fill="none" stroke="#26364C" class="hairline" />

  <g class="wide">
    <circle cx="60" cy="64" r="4" fill="#62D4E8" />
    <path d="M68 64H286" stroke="#37516A" stroke-width="1" class="hairline" />
    <text x="80" y="55" class="rail">LAITH / SIGNAL PROFILE</text>
    <path d="M300 64H1132" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="1140" cy="64" r="4" fill="#D3A06F" />
    <text x="1024" y="52" class="rail-muted">PUBLIC PROFILE</text>

    <path d="M420 92V672" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="420" cy="108" r="3.5" fill="#62D4E8" />
    <circle cx="420" cy="672" r="3.5" fill="#D3A06F" />

    <text x="60" y="116" class="rail">SIGNAL / L-01</text>
    <g aria-label="ASCII signal-path L combining circuit, AI and quant motifs">
      <text x="72" y="176" class="ascii ascii-muted">      .--------o--------------&gt;</text>
      <text x="72" y="204" class="ascii ascii-muted">      |</text>
      <text x="72" y="232" class="ascii"><tspan class="ascii-warm">   ██╗</tspan><tspan class="ascii-muted">|     +--</tspan><tspan class="ascii-cyan">[ AI ]</tspan><tspan class="ascii-muted">--+</tspan></text>
      <text x="72" y="260" class="ascii"><tspan class="ascii-warm">   ██║</tspan><tspan class="ascii-muted">o-----+          |</tspan></text>
      <text x="72" y="288" class="ascii"><tspan class="ascii-warm">   ██║</tspan><tspan class="ascii-muted">|                +--.</tspan></text>
      <text x="72" y="316" class="ascii"><tspan class="ascii-warm">   ██║</tspan><tspan class="ascii-muted">|       </tspan><tspan class="ascii-cyan">_/\_/\/</tspan><tspan class="ascii-muted">     |</tspan></text>
      <text x="72" y="344" class="ascii"><tspan class="ascii-warm">   ███████╗</tspan><tspan class="ascii-cyan">---o-----------+--&gt;</tspan></text>
      <text x="72" y="372" class="ascii ascii-warm">   ╚══════╝</text>
      <text x="72" y="400" class="ascii ascii-muted">      |</text>
      <text x="72" y="428" class="ascii"><tspan class="ascii-muted">      '------o--</tspan><tspan class="ascii-cyan">[ QUANT ]</tspan></text>
    </g>

    <path d="M60 474H376" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="60" cy="474" r="3" fill="#D3A06F" />
    <circle cx="376" cy="474" r="3" fill="#62D4E8" />
    <text x="60" y="512" class="domain">EEE / AI / QUANT</text>
    <text x="60" y="541" class="domain-sub">hardware &lt;-&gt; software &lt;-&gt; systems</text>
    <text x="60" y="622" class="rail-muted">ASTON UNIVERSITY · CLASS OF 2027</text>
    <text x="60" y="650" class="domain-sub">BEng Electrical &amp; Electronic Engineering</text>

    <text x="454" y="106" class="prompt"><tspan class="prompt-user">laithm@github</tspan><tspan>:~$ profile --overview</tspan></text>
    <path d="M454 118H1140" stroke="#26364C" stroke-width="1" class="hairline" />
    <text x="454" y="154" class="name">Laith Masri</text>
    <text x="454" y="181" class="tagline">Founder of Lunvex Labs · engineering, software &amp; systems</text>

    <text x="454" y="217" class="section">PROFILE</text>
    <path d="M528 213H1140" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="1140" cy="213" r="3" fill="#62D4E8" />

    <text x="454" y="246" class="row-label">Role</text>
    <line x1="554" y1="241" x2="688" y2="241" class="leader hairline" />
    <text x="704" y="246" class="row-value">Founder, Lunvex Labs</text>

    <text x="454" y="273" class="row-label">Degree</text>
    <line x1="554" y1="268" x2="688" y2="268" class="leader hairline" />
    <text x="704" y="273" class="row-value">BEng Electrical &amp; Electronic Engineering</text>

    <text x="454" y="300" class="row-label">University</text>
    <line x1="554" y1="295" x2="688" y2="295" class="leader hairline" />
    <text x="704" y="300" class="row-value">Aston University · class of 2027</text>

    <text x="454" y="327" class="row-label">Direction</text>
    <line x1="554" y1="322" x2="688" y2="322" class="leader hairline" />
    <text x="704" y="327" class="row-value">Quant hardware · AI infrastructure · web</text>

    <text x="454" y="363" class="section">ENGINEERING</text>
    <path d="M564 359H1140" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="1140" cy="359" r="3" fill="#62D4E8" />

    <text x="454" y="392" class="row-label">Languages</text>
    <line x1="554" y1="387" x2="688" y2="387" class="leader hairline" />
    <text x="704" y="392" class="row-value">Python · JavaScript / TypeScript · C++</text>

    <text x="454" y="419" class="row-label">Data</text>
    <line x1="554" y1="414" x2="688" y2="414" class="leader hairline" />
    <text x="704" y="419" class="row-value">NumPy · pandas</text>

    <text x="454" y="446" class="row-label">Web</text>
    <line x1="554" y1="441" x2="688" y2="441" class="leader hairline" />
    <text x="704" y="446" class="row-value">React · Next.js · HTML · CSS</text>

    <text x="454" y="482" class="section">CURRENT WORK</text>
    <path d="M568 478H1140" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="1140" cy="478" r="3" fill="#D3A06F" />

    <text x="454" y="511" class="row-label">Device</text>
    <line x1="554" y1="506" x2="688" y2="506" class="leader hairline" />
    <text x="704" y="511" class="row-value">QuantPod · edge strategy execution</text>

    <text x="454" y="538" class="row-label">Platform</text>
    <line x1="554" y1="533" x2="688" y2="533" class="leader hairline" />
    <text x="704" y="538" class="row-value">Alpha marketplace</text>

    <text x="454" y="565" class="row-label">AI</text>
    <line x1="554" y1="560" x2="688" y2="560" class="leader hairline" />
    <text x="704" y="565" class="row-value">In-house AI / Llama · server + rack design</text>

    <text x="454" y="592" class="row-label">Web</text>
    <line x1="554" y1="587" x2="688" y2="587" class="leader hairline" />
    <text x="704" y="592" class="row-value">Conversion-focused client sites</text>

    <text x="454" y="628" class="section">CONNECT</text>
    <path d="M528 624H1140" stroke="#26364C" stroke-width="1" class="hairline" />
    <circle cx="1140" cy="624" r="3" fill="#62D4E8" />

    <text x="454" y="657" class="row-label">Sites</text>
    <line x1="554" y1="652" x2="688" y2="652" class="leader hairline" />
    <text x="704" y="657" class="row-value">laithmasri.dev · lunvexlabs.com</text>

    <text x="454" y="684" class="row-label">Contact</text>
    <line x1="554" y1="679" x2="688" y2="679" class="leader hairline" />
    <text x="704" y="684" class="row-value">github.com/laithm · contact@laithmasri.dev</text>
  </g>

</svg>
