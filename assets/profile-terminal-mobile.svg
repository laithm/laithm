<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 880"
  role="img"
  aria-labelledby="mobile-title mobile-desc"
  preserveAspectRatio="xMidYMid meet"
  xml:space="preserve"
>
  <title id="mobile-title">Laith Masri terminal profile for narrow screens</title>
  <desc id="mobile-desc">
    A compact dark terminal profile for Laith Masri with a signal-path L, public profile details, engineering stack, current work and public contact details.
  </desc>

  <defs>
    <linearGradient id="mobile-panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1726" />
      <stop offset="0.58" stop-color="#0B1320" />
      <stop offset="1" stop-color="#080F1A" />
    </linearGradient>
    <radialGradient id="mobile-glow" cx="0" cy="0" r="1" gradientTransform="translate(150 230) rotate(75) scale(280 320)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17475A" stop-opacity="0.32" />
      <stop offset="0.66" stop-color="#10283B" stop-opacity="0.1" />
      <stop offset="1" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="mobile-shadow" x="0" y="0" width="720" height="880" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="mobile-clip">
      <rect x="16" y="16" width="688" height="848" rx="20" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;
    }

    .hairline {
      vector-effect: non-scaling-stroke;
    }

    .rail {
      fill: #D3A06F;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.6px;
    }

    .prompt {
      fill: #B7C0CD;
      font-size: 19px;
      font-weight: 500;
    }

    .prompt-user {
      fill: #62D4E8;
      font-weight: 700;
    }

    .name {
      fill: #E8EDF3;
      font-size: 38px;
      font-weight: 700;
    }

    .tagline {
      fill: #B7C0CD;
      font-size: 20px;
    }

    .signal {
      font-size: 21px;
      font-weight: 700;
    }

    .signal-warm {
      fill: #D3A06F;
    }

    .signal-cyan {
      fill: #62D4E8;
    }

    .signal-muted {
      fill: #75869A;
    }

    .section {
      fill: #62D4E8;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .label {
      fill: #D3A06F;
      font-size: 20px;
      font-weight: 700;
    }

    .value {
      fill: #E8EDF3;
      font-size: 20px;
      font-weight: 500;
    }

    .leader {
      stroke: #536278;
      stroke-width: 1.4;
      stroke-dasharray: 1 6;
      stroke-linecap: round;
    }

    .link {
      fill: #E8EDF3;
      font-size: 18px;
      font-weight: 500;
    }
  </style>

  <rect width="720" height="880" rx="28" fill="#060A12" />
  <rect x="16" y="16" width="688" height="848" rx="20" fill="url(#mobile-panel-fill)" filter="url(#mobile-shadow)" />
  <g clip-path="url(#mobile-clip)">
    <ellipse cx="150" cy="230" rx="320" ry="280" fill="url(#mobile-glow)" />
  </g>
  <rect x="16.5" y="16.5" width="687" height="847" rx="19.5" fill="none" stroke="#26364C" class="hairline" />

  <circle cx="38" cy="62" r="4" fill="#62D4E8" />
  <path d="M46 62H682" stroke="#37516A" stroke-width="1" class="hairline" />
  <circle cx="682" cy="62" r="4" fill="#D3A06F" />
  <text x="56" y="53" class="rail">LAITH / SIGNAL PROFILE</text>

  <text x="38" y="104" class="prompt"><tspan class="prompt-user">laithm@github</tspan><tspan>:~$ profile --overview</tspan></text>
  <text x="38" y="157" class="name">Laith Masri</text>
  <text x="38" y="191" class="tagline">Founder · engineering, software &amp; systems</text>

  <text x="38" y="240" class="signal"><tspan class="signal-warm">L</tspan><tspan class="signal-muted">--o--</tspan><tspan class="signal-cyan">[ EEE ]</tspan><tspan class="signal-muted">--</tspan><tspan class="signal-cyan">[ AI ]</tspan><tspan class="signal-muted">--</tspan><tspan class="signal-cyan">[ QUANT ]</tspan><tspan class="signal-muted">--&gt;</tspan></text>

  <text x="38" y="286" class="section">PROFILE</text>
  <path d="M128 280H682" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="682" cy="280" r="3" fill="#62D4E8" />

  <text x="38" y="327" class="label">Role</text>
  <line x1="168" y1="320" x2="190" y2="320" class="leader hairline" />
  <text x="204" y="327" class="value">Founder, Lunvex Labs</text>

  <text x="38" y="365" class="label">Degree</text>
  <line x1="168" y1="358" x2="190" y2="358" class="leader hairline" />
  <text x="204" y="365" class="value">BEng Electrical &amp; Electronic Engineering</text>

  <text x="38" y="403" class="label">University</text>
  <line x1="168" y1="396" x2="190" y2="396" class="leader hairline" />
  <text x="204" y="403" class="value">Aston University · class of 2027</text>

  <text x="38" y="441" class="label">Direction</text>
  <line x1="168" y1="434" x2="190" y2="434" class="leader hairline" />
  <text x="204" y="441" class="value">Quant hardware · AI infrastructure · web</text>

  <text x="38" y="491" class="section">ENGINEERING</text>
  <path d="M164 485H682" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="682" cy="485" r="3" fill="#62D4E8" />

  <text x="38" y="531" class="label">Code</text>
  <line x1="168" y1="524" x2="190" y2="524" class="leader hairline" />
  <text x="204" y="531" class="value">Python · JavaScript / TypeScript · C++</text>

  <text x="38" y="569" class="label">Stack</text>
  <line x1="168" y1="562" x2="190" y2="562" class="leader hairline" />
  <text x="204" y="569" class="value">NumPy · pandas · React / Next.js</text>

  <text x="38" y="619" class="section">CURRENT WORK</text>
  <path d="M176 613H682" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="682" cy="613" r="3" fill="#D3A06F" />

  <text x="38" y="659" class="label">Build</text>
  <line x1="168" y1="652" x2="190" y2="652" class="leader hairline" />
  <text x="204" y="659" class="value">QuantPod · edge execution · marketplace</text>

  <text x="38" y="697" class="label">Systems</text>
  <line x1="168" y1="690" x2="190" y2="690" class="leader hairline" />
  <text x="204" y="697" class="value">AI / Llama · server + rack design</text>

  <text x="38" y="747" class="section">CONNECT</text>
  <path d="M128 741H682" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="682" cy="741" r="3" fill="#62D4E8" />

  <text x="38" y="790" class="link">laithmasri.dev · lunvexlabs.com</text>
  <text x="38" y="828" class="link">github.com/laithm · contact@laithmasri.dev</text>
</svg>
