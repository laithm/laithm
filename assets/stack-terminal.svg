<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 470"
  role="img"
  aria-labelledby="stack-title stack-desc"
  preserveAspectRatio="xMidYMid meet"
  xml:space="preserve"
>
  <title id="stack-title">Laith Masri engineering stack terminal</title>
  <desc id="stack-desc">
    A terminal-style panel showing Laith Masri's programming languages, quant and web stack, AI systems work, and engineering interests.
  </desc>

  <defs>
    <linearGradient id="stack-panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1726" />
      <stop offset="0.58" stop-color="#0B1320" />
      <stop offset="1" stop-color="#080F1A" />
    </linearGradient>
    <radialGradient id="stack-glow" cx="0" cy="0" r="1" gradientTransform="translate(600 250) rotate(90) scale(250 540)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173D50" stop-opacity="0.18" />
      <stop offset="0.72" stop-color="#10283B" stop-opacity="0.06" />
      <stop offset="1" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="stack-shadow" x="0" y="0" width="1200" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="stack-clip">
      <rect x="24" y="20" width="1152" height="430" rx="20" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;
    }

    .hairline { vector-effect: non-scaling-stroke; }
    .rail { fill: #D3A06F; font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .rail-muted { fill: #9AA7B8; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .prompt { fill: #B7C0CD; font-size: 15.5px; font-weight: 500; }
    .prompt-user { fill: #62D4E8; font-weight: 700; }
    .section { fill: #62D4E8; font-size: 12.5px; font-weight: 700; letter-spacing: 1.8px; }
    .label { fill: #D3A06F; font-size: 14.5px; font-weight: 700; }
    .value { fill: #E8EDF3; font-size: 14.5px; font-weight: 500; }
    .interest { fill: #E8EDF3; font-size: 14px; font-weight: 500; }
    .meta { fill: #9AA7B8; font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
    .motto { fill: #B7C0CD; font-size: 11.5px; font-weight: 500; }
    .leader { stroke: #536278; stroke-width: 1.4; stroke-dasharray: 1 6; stroke-linecap: round; }
  </style>

  <rect width="1200" height="470" rx="28" fill="#060A12" />
  <rect x="24" y="20" width="1152" height="430" rx="20" fill="url(#stack-panel-fill)" filter="url(#stack-shadow)" />
  <g clip-path="url(#stack-clip)">
    <ellipse cx="600" cy="250" rx="540" ry="250" fill="url(#stack-glow)" />
  </g>
  <rect x="24.5" y="20.5" width="1151" height="429" rx="19.5" fill="none" stroke="#26364C" class="hairline" />

  <circle cx="60" cy="64" r="4" fill="#62D4E8" />
  <path d="M68 64H1132" stroke="#37516A" stroke-width="1" class="hairline" />
  <circle cx="1140" cy="64" r="4" fill="#D3A06F" />
  <text x="80" y="55" class="rail">ENGINEERING / SIGNAL MAP</text>
  <text x="1023" y="52" class="rail-muted">STATIC PROFILE</text>

  <text x="60" y="104" class="prompt"><tspan class="prompt-user">laithm@github</tspan><tspan>:~$ map ./stack ./interests</tspan></text>

  <rect x="60" y="130" width="520" height="245" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <rect x="620" y="130" width="520" height="245" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <path d="M600 130V375" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="600" cy="130" r="3.5" fill="#62D4E8" />
  <circle cx="600" cy="375" r="3.5" fill="#D3A06F" />

  <text x="80" y="162" class="section">TECHNICAL / STACK</text>
  <path d="M232 158H558" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="558" cy="158" r="3" fill="#62D4E8" />

  <text x="80" y="198" class="label">Languages</text>
  <line x1="188" y1="193" x2="246" y2="193" class="leader hairline" />
  <text x="260" y="198" class="value">Python · JavaScript</text>
  <text x="260" y="222" class="value">TypeScript · C++</text>

  <text x="80" y="253" class="label">Quant / data</text>
  <line x1="188" y1="248" x2="246" y2="248" class="leader hairline" />
  <text x="260" y="253" class="value">NumPy · pandas</text>

  <text x="80" y="287" class="label">Web</text>
  <line x1="188" y1="282" x2="246" y2="282" class="leader hairline" />
  <text x="260" y="287" class="value">React · Next.js · HTML · CSS</text>

  <text x="80" y="321" class="label">AI / systems</text>
  <line x1="188" y1="316" x2="246" y2="316" class="leader hairline" />
  <text x="260" y="321" class="value">in-house AI / Llama builds</text>
  <text x="260" y="348" class="value">server + rack design · custom hardware</text>

  <text x="640" y="162" class="section">ENGINEERING / INTERESTS</text>
  <path d="M844 158H1118" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="1118" cy="158" r="3" fill="#62D4E8" />

  <circle cx="652" cy="195" r="3.5" fill="#D3A06F" />
  <text x="670" y="190" class="meta">HARDWARE</text>
  <text x="670" y="213" class="interest">electrical + electronic systems</text>
  <text x="670" y="236" class="interest">performance-aware custom hardware</text>

  <circle cx="652" cy="259" r="3.5" fill="#62D4E8" />
  <text x="670" y="254" class="meta">QUANT</text>
  <text x="670" y="277" class="interest">edge-native systems · autonomous strategy execution</text>
  <text x="670" y="300" class="interest">mathematical foundations -&gt; strategy testing</text>

  <circle cx="652" cy="323" r="3.5" fill="#D3A06F" />
  <text x="670" y="318" class="meta">COMPUTE</text>
  <text x="670" y="341" class="interest">model + compute infrastructure</text>
  <text x="670" y="364" class="interest">workload performance + economics</text>

  <circle cx="60" cy="415" r="3.5" fill="#D3A06F" />
  <path d="M68 415H690" stroke="#26364C" stroke-width="1" class="hairline" />
  <text x="708" y="419" class="motto">Resourcefulness beats pedigree. Building undeniable proof-of-work.</text>
  <circle cx="1140" cy="415" r="3.5" fill="#62D4E8" />
</svg>
