<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 650"
  role="img"
  aria-labelledby="work-title work-desc"
  preserveAspectRatio="xMidYMid meet"
  xml:space="preserve"
>
  <title id="work-title">Laith Masri workbench terminal</title>
  <desc id="work-desc">
    A terminal-style workbench showing Laith Masri's current work and selected projects across QuantPod, AI infrastructure, web delivery and quantitative research.
  </desc>

  <defs>
    <linearGradient id="work-panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1726" />
      <stop offset="0.58" stop-color="#0B1320" />
      <stop offset="1" stop-color="#080F1A" />
    </linearGradient>
    <radialGradient id="work-glow" cx="0" cy="0" r="1" gradientTransform="translate(602 318) rotate(90) scale(360 520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173D50" stop-opacity="0.2" />
      <stop offset="0.68" stop-color="#10283B" stop-opacity="0.08" />
      <stop offset="1" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="work-shadow" x="0" y="0" width="1200" height="650" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="work-clip">
      <rect x="24" y="20" width="1152" height="610" rx="20" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;
    }

    .hairline { vector-effect: non-scaling-stroke; }
    .rail { fill: #D3A06F; font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .rail-muted { fill: #9AA7B8; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .prompt { fill: #B7C0CD; font-size: 15.5px; font-weight: 500; }
    .prompt-user { fill: #62D4E8; font-weight: 700; }
    .subtitle { fill: #9AA7B8; font-size: 13px; }
    .section { fill: #62D4E8; font-size: 12.5px; font-weight: 700; letter-spacing: 1.8px; }
    .item { fill: #E8EDF3; font-size: 16px; font-weight: 700; }
    .meta { fill: #9AA7B8; font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .label { fill: #D3A06F; font-size: 14px; font-weight: 700; }
    .value { fill: #E8EDF3; font-size: 14px; font-weight: 500; }
    .url { fill: #9AA7B8; font-size: 13px; font-weight: 500; }
    .footer { fill: #9AA7B8; font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
  </style>

  <rect width="1200" height="650" rx="28" fill="#060A12" />
  <rect x="24" y="20" width="1152" height="610" rx="20" fill="url(#work-panel-fill)" filter="url(#work-shadow)" />
  <g clip-path="url(#work-clip)">
    <ellipse cx="602" cy="318" rx="520" ry="360" fill="url(#work-glow)" />
  </g>
  <rect x="24.5" y="20.5" width="1151" height="609" rx="19.5" fill="none" stroke="#26364C" class="hairline" />

  <circle cx="60" cy="64" r="4" fill="#62D4E8" />
  <path d="M68 64H1132" stroke="#37516A" stroke-width="1" class="hairline" />
  <circle cx="1140" cy="64" r="4" fill="#D3A06F" />
  <text x="80" y="55" class="rail">WORKBENCH / CAPITAL + INTELLIGENCE</text>
  <text x="1047" y="52" class="rail-muted">ACTIVE NODES</text>

  <text x="60" y="104" class="prompt"><tspan class="prompt-user">laithm@github</tspan><tspan>:~$ inspect ./workbench --active</tspan></text>
  <text x="60" y="126" class="subtitle">hardware + software + systems for capital + intelligence</text>

  <rect x="60" y="145" width="520" height="415" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <rect x="620" y="145" width="520" height="415" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <path d="M600 145V560" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="600" cy="145" r="3.5" fill="#62D4E8" />
  <circle cx="600" cy="560" r="3.5" fill="#D3A06F" />

  <text x="80" y="176" class="section">CURRENT / WORK</text>
  <path d="M208 172H558" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="558" cy="172" r="3" fill="#62D4E8" />

  <text x="80" y="211" class="item">quantpod</text>
  <text x="449" y="209" class="meta">EDGE / QUANT</text>
  <text x="80" y="239" class="label">purpose</text>
  <text x="178" y="239" class="value">pocket device for autonomous strategy execution</text>
  <text x="80" y="265" class="label">market</text>
  <text x="178" y="265" class="value">accompanying alpha marketplace</text>

  <text x="80" y="303" class="item">ai_infrastructure</text>
  <text x="420" y="301" class="meta">MODELS / COMPUTE</text>
  <text x="80" y="331" class="label">builds</text>
  <text x="178" y="331" class="value">in-house AI / Llama builds</text>
  <text x="80" y="357" class="label">infra</text>
  <text x="178" y="357" class="value">server + rack design · custom hardware</text>
  <text x="80" y="383" class="label">tuning</text>
  <text x="178" y="383" class="value">performance + economics</text>

  <text x="80" y="421" class="item">web_delivery</text>
  <text x="507" y="419" class="meta">WEB</text>
  <text x="80" y="449" class="label">delivery</text>
  <text x="178" y="449" class="value">fast, modern, conversion-focused sites</text>
  <text x="80" y="475" class="label">clients</text>
  <text x="178" y="475" class="value">driving instructors · tutors · local businesses</text>
  <text x="80" y="501" class="label">service</text>
  <text x="178" y="501" class="value">designed · built · maintained</text>

  <text x="640" y="176" class="section">PROJECT / INDEX</text>
  <path d="M768 172H1118" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="1118" cy="172" r="3" fill="#62D4E8" />

  <text x="640" y="211" class="item">lunvex_labs</text>
  <text x="1023" y="209" class="meta">COMPANY</text>
  <text x="660" y="237" class="value">QuantPod · AI solutions · websites</text>
  <text x="660" y="260" class="url">lunvexlabs.com</text>

  <text x="640" y="297" class="item">quantpod-log</text>
  <text x="1048" y="295" class="meta">PUBLIC</text>
  <text x="660" y="323" class="value">public QuantPod build documentation</text>
  <text x="660" y="346" class="url">github.com/laithm/quantpod-log</text>

  <text x="640" y="383" class="item">quant-lab</text>
  <text x="1016" y="381" class="meta">RESEARCH</text>
  <text x="660" y="409" class="value">quant research · mathematical foundations -&gt; strategy testing</text>
  <text x="660" y="432" class="url">Python / Jupyter · github.com/laithm/quant-lab</text>

  <text x="640" y="475" class="item">laithmasri.dev</text>
  <text x="1055" y="473" class="meta">WEB</text>
  <text x="660" y="501" class="value">personal website · Next.js</text>
  <text x="660" y="524" class="url">laithmasri.dev</text>

  <circle cx="60" cy="595" r="3.5" fill="#D3A06F" />
  <path d="M68 595H957" stroke="#26364C" stroke-width="1" class="hairline" />
  <text x="974" y="600" class="footer">LINK TARGETS / BELOW</text>
  <circle cx="1140" cy="595" r="3.5" fill="#62D4E8" />
</svg>
