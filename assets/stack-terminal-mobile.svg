<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 700"
  role="img"
  aria-labelledby="stack-mobile-title stack-mobile-desc"
  preserveAspectRatio="xMidYMid meet"
  xml:space="preserve"
>
  <title id="stack-mobile-title">Laith Masri mobile engineering stack terminal</title>
  <desc id="stack-mobile-desc">
    A narrow terminal-style panel showing Laith Masri's programming languages, quant and web stack, AI systems work, and engineering interests.
  </desc>

  <defs>
    <linearGradient id="stack-mobile-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1726" />
      <stop offset="0.58" stop-color="#0B1320" />
      <stop offset="1" stop-color="#080F1A" />
    </linearGradient>
    <radialGradient id="stack-mobile-glow" cx="0" cy="0" r="1" gradientTransform="translate(360 350) rotate(90) scale(350 340)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173D50" stop-opacity="0.18" />
      <stop offset="0.72" stop-color="#10283B" stop-opacity="0.06" />
      <stop offset="1" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="stack-mobile-shadow" x="0" y="0" width="720" height="700" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="stack-mobile-clip">
      <rect x="16" y="16" width="688" height="668" rx="20" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;
    }

    .hairline { vector-effect: non-scaling-stroke; }
    .rail { fill: #D3A06F; font-size: 16px; font-weight: 700; letter-spacing: 1.6px; }
    .prompt { fill: #B7C0CD; font-size: 19px; font-weight: 500; }
    .prompt-user { fill: #62D4E8; font-weight: 700; }
    .section { fill: #62D4E8; font-size: 17px; font-weight: 700; letter-spacing: 1.8px; }
    .label { fill: #D3A06F; font-size: 18px; font-weight: 700; }
    .value { fill: #E8EDF3; font-size: 18px; font-weight: 500; }
    .meta { fill: #D3A06F; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
    .interest { fill: #E8EDF3; font-size: 18px; font-weight: 500; }
    .motto { fill: #B7C0CD; font-size: 14px; font-weight: 500; }
    .leader { stroke: #536278; stroke-width: 1.4; stroke-dasharray: 1 6; stroke-linecap: round; }
  </style>

  <rect width="720" height="700" rx="28" fill="#060A12" />
  <rect x="16" y="16" width="688" height="668" rx="20" fill="url(#stack-mobile-fill)" filter="url(#stack-mobile-shadow)" />
  <g clip-path="url(#stack-mobile-clip)">
    <ellipse cx="360" cy="350" rx="340" ry="350" fill="url(#stack-mobile-glow)" />
  </g>
  <rect x="16.5" y="16.5" width="687" height="667" rx="19.5" fill="none" stroke="#26364C" class="hairline" />

  <circle cx="38" cy="60" r="4" fill="#62D4E8" />
  <path d="M46 60H682" stroke="#37516A" stroke-width="1" class="hairline" />
  <circle cx="682" cy="60" r="4" fill="#D3A06F" />
  <text x="56" y="51" class="rail">ENGINEERING / SIGNAL MAP</text>
  <text x="38" y="101" class="prompt"><tspan class="prompt-user">laithm@github</tspan><tspan>:~$ map ./stack ./interests</tspan></text>

  <rect x="38" y="130" width="644" height="260" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <text x="58" y="162" class="section">TECHNICAL / STACK</text>
  <path d="M252 156H662" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="662" cy="156" r="3" fill="#62D4E8" />

  <text x="58" y="201" class="label">Languages</text>
  <line x1="164" y1="194" x2="192" y2="194" class="leader hairline" />
  <text x="210" y="201" class="value">Python · JavaScript</text>
  <text x="210" y="225" class="value">TypeScript · C++</text>

  <text x="58" y="263" class="label">Quant / data</text>
  <line x1="164" y1="256" x2="192" y2="256" class="leader hairline" />
  <text x="210" y="263" class="value">NumPy · pandas</text>

  <text x="58" y="301" class="label">Web</text>
  <line x1="164" y1="294" x2="192" y2="294" class="leader hairline" />
  <text x="210" y="301" class="value">React · Next.js · HTML · CSS</text>

  <text x="58" y="339" class="label">AI / systems</text>
  <line x1="164" y1="332" x2="192" y2="332" class="leader hairline" />
  <text x="210" y="339" class="value">AI / Llama · server + rack design</text>
  <text x="210" y="363" class="value">custom hardware</text>

  <rect x="38" y="414" width="644" height="236" rx="12" fill="#08111D" fill-opacity="0.58" stroke="#26364C" class="hairline" />
  <text x="58" y="447" class="section">ENGINEERING / INTERESTS</text>
  <path d="M302 441H662" stroke="#26364C" stroke-width="1" class="hairline" />
  <circle cx="662" cy="441" r="3" fill="#62D4E8" />

  <circle cx="58" cy="484" r="3.5" fill="#D3A06F" />
  <text x="76" y="479" class="meta">HARDWARE</text>
  <text x="76" y="506" class="interest">electrical / electronic systems · custom hardware</text>

  <circle cx="58" cy="547" r="3.5" fill="#62D4E8" />
  <text x="76" y="542" class="meta">QUANT</text>
  <text x="76" y="569" class="interest">edge systems · autonomous execution · strategy testing</text>

  <circle cx="58" cy="610" r="3.5" fill="#D3A06F" />
  <text x="76" y="605" class="meta">COMPUTE</text>
  <text x="76" y="632" class="interest">model / compute infrastructure · workload economics</text>

  <text x="58" y="674" class="motto">Resourcefulness beats pedigree. Building undeniable proof-of-work.</text>
</svg>
